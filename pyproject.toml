[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ytb-channel-downloader"
version = "0.1.0"
description = "Windows GUI for scanning and downloading YouTube channels and playlists with yt-dlp"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "PySide6>=6.8,<7",
  "yt-dlp[default]>=2025.1.15",
]

[project.optional-dependencies]
dev = ["pytest>=9.1,<10"]

[project.gui-scripts]
ytb-channel-downloader = "ytb_gui.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
